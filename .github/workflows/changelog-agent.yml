name: Changelog Agent

on:
  # Triggered by the watchflare repo on every new release (see below)
  repository_dispatch:
    types: [new-release]
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.34.0)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate changelog entry
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: python .github/scripts/generate_changelog.py

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: changelog/${{ steps.generate.outputs.tag }}
          TAG: ${{ steps.generate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/docs/en/changelog.mdx
          git commit -m "docs: add changelog entry for $TAG"
          git push origin "$BRANCH"
          gh pr create \
            --draft \
            --title "docs: changelog $TAG" \
            --body "Changelog entry generated by Claude from the GitHub release notes. Review and adjust before merging." \
            --base main \
            --head "$BRANCH"
